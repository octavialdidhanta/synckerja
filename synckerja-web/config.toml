# Minimal Supabase CLI config. Adjust project_id when linking.

[api]
enabled = true

# Custom verification: Resend + OTP (`send-confirmation-email`, `confirm_email_verification_otp`).
# When true, GoTrue also sends "Confirm your signup" (link) — duplicate of the Synckerja OTP email.
# Hosted: set the same in Dashboard → Authentication → Sign In / Providers → Email → Confirm email = off.
# Or: `npx supabase config push` after linking, if you manage auth through CLI.
[auth.email]
enable_confirmations = false

# TOTP MFA for Owner/Admin step-up (Synckerja /settings/security).
# Hosted: Dashboard → Authentication → MFA → enable TOTP.
[auth.mfa]
max_enrolled_factors = 10

# Edge gateway validates JWT before your function runs. If JWT verification stays ON in the
# hosted project, you get POST 401 with execution_id null and no function logs.
#
# Supabase Auth can issue user access tokens as ES256 (asymmetric). The dashboard toggle
# "Verify JWT with legacy secret" only accepts HS256 (anon/service legacy) — so authenticated
# browser calls fail at the gateway. Turn verify_jwt OFF for app-called functions and enforce
# auth inside the function with supabase.auth.getUser(access_token) where needed.
#
# Deploy: `supabase functions deploy <name> --no-verify-jwt` (or MCP deploy with verify_jwt: false)
[functions.send-confirmation-email]
verify_jwt = false

[functions.send-payroll-paid-email]
verify_jwt = false

[functions.send-recruitment-interview-email]
verify_jwt = false

[functions.notify-payroll-paid-batch]
verify_jwt = false

# Midtrans server-to-server notification has no user JWT
[functions.process-midtrans-payment]
verify_jwt = false

# Dedicated notification URL (signature check + forward to process-midtrans-payment)
[functions.midtrans-webhook]
verify_jwt = false

[functions.get-midtrans-config]
