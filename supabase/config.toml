# Minimal Supabase CLI config. Adjust project_id when linking.

[api]
enabled = true

# Custom verification: Resend + OTP (`send-confirmation-email`, `confirm_email_verification_otp`).
# When true, GoTrue also sends "Confirm your signup" (link) — duplicate of the Synckerja OTP email.
# Hosted: set the same in Dashboard → Authentication → Sign In / Providers → Email → Confirm email = off.
# Or: `npx supabase config push` after linking, if you manage auth through CLI.
[auth.email]
enable_confirmations = false

# Edge gateway validates JWT before your function runs. If JWT verification stays ON in the
# hosted project, you get POST 401 with execution_id null and no function logs.
#
# Supabase Auth can issue user access tokens as ES256 (asymmetric). The dashboard toggle
# "Verify JWT with legacy secret" only accepts HS256 (anon/service legacy) — so authenticated
# browser calls fail at the gateway. Turn verify_jwt OFF for app-called functions and enforce
# auth inside the function with supabase.auth.getUser(access_token) where needed.
#
# Deploy: `supabase functions deploy <name> --no-verify-jwt` (or MCP deploy with verify_jwt: false)
[functions.send-confirmation-email]
verify_jwt = false

# Midtrans server-to-server notification has no user JWT
[functions.process-midtrans-payment]
verify_jwt = false

# Dedicated notification URL (signature check + forward to process-midtrans-payment)
[functions.midtrans-webhook]
verify_jwt = false

[functions.get-midtrans-config]
verify_jwt = false

# Public read of Maps JS API key (same pattern as get-midtrans-config); set GOOGLE_MAPS_API_KEY in project secrets.
[functions.google-maps-key]
verify_jwt = false

# Native Google Sign-In (public web/iOS client ids for Capacitor; no user JWT).
[functions.google-sso-public-config]
verify_jwt = false

[functions.calculate-prorate]
verify_jwt = false

[functions.create-midtrans-payment]
verify_jwt = false

[functions.check-midtrans-payment-status]
verify_jwt = false

[functions.get-midtrans-snap-token]
verify_jwt = false

[functions.cancel-pending-payment]
verify_jwt = false

# Browser invokes with user access_token (often ES256). Gateway JWT verify → 401, execution_id null.
# Auth is enforced inside each handler (service role + auth.getUser(jwt)).
[functions.generate-design-image]
verify_jwt = false

[functions.detect-digital-asset-image]
verify_jwt = false

[functions.generate-script-ai]
verify_jwt = false

[functions.analyze-expense-receipt-ai]
verify_jwt = false

# Browser calls with user JWT (ES256); auth enforced inside (getUser + token exchange).
[functions.google-oauth-token]
verify_jwt = false

[functions.google-oauth-manage]
verify_jwt = false

[functions.google-drive-file-meta]
verify_jwt = false

[functions.google-drive-list-folder]
verify_jwt = false

[functions.google-drive-file-media]
verify_jwt = false

[functions.google-drive-file-thumbnail]
verify_jwt = false

# Browser calls with user JWT (ES256); auth enforced inside (getUser + service role).
[functions.whatsapp-message-templates]
verify_jwt = false

[functions.whatsapp-template-header-upload]
verify_jwt = false

[functions.whatsapp-flows]
verify_jwt = false

# User JWT + optional cron secret inside body/header; auth enforced in function.
[functions.whatsapp-campaign-worker]
verify_jwt = false

# Cron / scheduler calls with x-customer-survey-dispatch-secret; dispatches pending survey WhatsApp messages (service role inside).
[functions.dispatch-customer-survey-wa]
verify_jwt = false

# Google Ads per-tenant: user JWT validated inside; OAuth callback has no JWT.
[functions.google-ads-upload-offline-conversion]
verify_jwt = false

[functions.google-ads-oauth-start]
verify_jwt = false

[functions.google-ads-oauth-callback]
verify_jwt = false

[functions.google-ads-config]
verify_jwt = false

[functions.google-ads-metrics]
verify_jwt = false
