name: Database migrations

# Applies new files in supabase/migrations/ to the production database.
#
#   pull_request -> "plan" job: checks the rules below and runs `supabase db push --dry-run`
#                   so the PR shows exactly which migrations would be applied. Writes nothing.
#   push to main -> "deploy" job: runs `supabase db push`, which applies only migrations that
#                   are not yet recorded in supabase_migrations.schema_migrations.
#
# Rules (enforced in the plan job):
#   - Only ADD files under supabase/migrations/. Editing, renaming or deleting a file that may
#     already be applied is refused: change the schema with a new migration instead.
#   - New file names must look like <14-digit version>_<name>.sql and be newer than every
#     version already in the folder.
#
# Do not change the production schema in the SQL Editor any more: write a migration and open a
# PR, otherwise the repo and the database drift apart again.

on:
  pull_request:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrations-deploy.yml"
  push:
    branches: [main]
    paths:
      - "supabase/migrations/**"
      - ".github/workflows/migrations-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  plan:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Only new migration files, newer than existing ones
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          changed="$(git diff --name-status --diff-filter=MDRT "$BASE"...HEAD -- supabase/migrations/)"
          if [ -n "$changed" ]; then
            echo "::error::Existing migration files were edited, renamed or deleted. Add a new migration instead:"
            echo "$changed"
            exit 1
          fi
          added="$(git diff --name-only --diff-filter=A "$BASE"...HEAD -- supabase/migrations/)"
          if [ -z "$added" ]; then echo "No new migrations in this PR."; exit 0; fi
          latest_existing="$(git ls-tree --name-only "$BASE" supabase/migrations/ | sed -n 's#.*/\([0-9]\{14\}\)_.*\.sql$#\1#p' | sort | tail -1)"
          fail=0
          for f in $added; do
            name="$(basename "$f")"
            if ! echo "$name" | grep -qE '^[0-9]{14}_[a-z0-9_]+\.sql$'; then
              echo "::error file=$f::Name must be <YYYYMMDDHHMMSS>_<lower_snake_name>.sql"; fail=1; continue
            fi
            v="${name%%_*}"
            if [ -n "$latest_existing" ] && { [ "$v" \< "$latest_existing" ] || [ "$v" = "$latest_existing" ]; }; then
              echo "::error file=$f::Version $v must be newer than the latest existing migration $latest_existing"; fail=1
            fi
          done
          dupes="$(for f in $added; do basename "$f" | cut -d_ -f1; done | sort | uniq -d)"
          if [ -n "$dupes" ]; then echo "::error::Two new files share a version: $dupes"; fail=1; fi
          exit $fail

      - name: Skip production dry-run for forks
        if: github.event.pull_request.head.repo.full_name != github.repository
        run: echo "PR from a fork has no access to secrets; the dry-run runs after merge review."

      - name: Install Supabase CLI (npm; avoids GitHub API rate limits)
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          # The npm package refuses global installs; install into a temp prefix and put its bin on PATH.
          npm install --no-save --prefix "$RUNNER_TEMP/supabase-cli" supabase@latest
          echo "$RUNNER_TEMP/supabase-cli/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/supabase-cli/node_modules/.bin/supabase" --version

      - name: Dry-run against production (no changes)
        if: github.event.pull_request.head.repo.full_name == github.repository
        run: |
          # Steps run with `bash -e` but not pipefail, so a failing dry-run would hide behind `tee`.
          set -o pipefail
          # The CLI reads SUPABASE_DB_PASSWORD from the environment (--password is ignored now).
          supabase link --project-ref "$SUPABASE_PROJECT_ID"
          supabase db push --remote --dry-run 2>&1 | tee dry-run.txt
          {
            echo "### Migrations that will run on merge"
            echo '```'
            cat dry-run.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # One deploy at a time; never cancel a deploy that is already applying SQL.
    concurrency:
      group: production-migrations
      cancel-in-progress: false
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v5

      - name: Install Supabase CLI (npm; avoids GitHub API rate limits)
        run: |
          # The npm package refuses global installs; install into a temp prefix and put its bin on PATH.
          npm install --no-save --prefix "$RUNNER_TEMP/supabase-cli" supabase@latest
          echo "$RUNNER_TEMP/supabase-cli/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/supabase-cli/node_modules/.bin/supabase" --version

      - name: Link project
        # The CLI reads SUPABASE_DB_PASSWORD from the environment (--password is ignored now).
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"

      - name: Show pending migrations
        run: supabase db push --remote --dry-run

      - name: Apply pending migrations
        # Without a terminal the CLI refuses piped answers and requires an explicit --yes.
        run: supabase db push --remote --yes

      - name: Show migration history
        # Informational only; never fail the deploy because of it.
        continue-on-error: true
        run: supabase migration list --linked

  types:
    # After every deploy, regenerate TypeScript types from the live schema. If they changed,
    # push them to a review branch (main is protected) and link a PR in the job summary.
    needs: deploy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      TYPES_FILE: supabase/database.types.ts
    steps:
      - uses: actions/checkout@v5

      - name: Install Supabase CLI (npm; avoids GitHub API rate limits)
        run: |
          # The npm package refuses global installs; install into a temp prefix and put its bin on PATH.
          npm install --no-save --prefix "$RUNNER_TEMP/supabase-cli" supabase@latest
          echo "$RUNNER_TEMP/supabase-cli/node_modules/.bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/supabase-cli/node_modules/.bin/supabase" --version

      - name: Generate types from production schema
        run: |
          supabase gen types typescript --project-id "$SUPABASE_PROJECT_ID" --schema public > "$TYPES_FILE.tmp"
          # Never replace the file with an empty or truncated result.
          if ! grep -q "export type Database" "$TYPES_FILE.tmp"; then
            echo "::error::Generated types look wrong (no 'export type Database'). Nothing was changed."
            head -20 "$TYPES_FILE.tmp"
            exit 1
          fi
          {
            echo "// Generated by .github/workflows/migrations-deploy.yml from the production schema."
            echo "// Do not edit by hand: changes are overwritten after the next migration deploy."
            cat "$TYPES_FILE.tmp"
          } > "$TYPES_FILE"
          rm "$TYPES_FILE.tmp"
          echo "Lines: $(wc -l < "$TYPES_FILE")"

      - name: Push to a review branch if types changed
        run: |
          git add -N "$TYPES_FILE"
          if git diff --quiet -- "$TYPES_FILE"; then
            echo "Types are already up to date."
            echo "Supabase types already up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="chore/supabase-types-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add "$TYPES_FILE"
          git commit -m "chore(types): regenerate Supabase types after ${GITHUB_SHA::7}"
          git push --force origin "$branch"
          {
            echo "### Supabase types changed"
            echo ""
            echo "- Branch: \`$branch\`"
            echo "- Open a PR: https://github.com/${GITHUB_REPOSITORY}/compare/main...${branch}?expand=1"
          } >> "$GITHUB_STEP_SUMMARY"
